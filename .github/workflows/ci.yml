name: Fida Taxi CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "modernization/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fida-taxi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze, Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate deployment scripts
        run: bash -n deploy/backend.sh

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Display toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Bootstrap workspace
        run: ./setup_workspace.sh --bootstrap-only

      - name: Verify reproducible bootstrap
        run: git diff --exit-code -- apps packages pubspec.lock

      - name: List workspace packages
        run: dart pub workspace list

      - name: Check formatting
        run: dart run melos run format:check --no-select

      - name: Static analysis
        run: dart run melos run analyze --no-select

      - name: Pure Dart tests
        run: dart run melos run test:dart --no-select

      - name: Flutter tests
        run: dart run melos run test:flutter --no-select

      - name: Build Rider Android debug APK
        working-directory: apps/rider
        run: flutter build apk --debug --no-pub

      - name: Stage Rider APK
        run: |
          mkdir -p dist
          cp apps/rider/build/app/outputs/flutter-apk/app-debug.apk dist/fida-taxi-rider-debug.apk

      - name: Upload Rider APK
        uses: actions/upload-artifact@v4
        with:
          name: fida-taxi-rider-debug
          path: dist/fida-taxi-rider-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Driver Android debug APK
        working-directory: apps/driver
        run: flutter build apk --debug --no-pub

      - name: Stage Driver APK
        run: |
          mkdir -p dist
          cp apps/driver/build/app/outputs/flutter-apk/app-debug.apk dist/fida-taxi-driver-debug.apk

      - name: Upload Driver APK
        uses: actions/upload-artifact@v4
        with:
          name: fida-taxi-driver-debug
          path: dist/fida-taxi-driver-debug.apk
          if-no-files-found: error
          retention-days: 14
