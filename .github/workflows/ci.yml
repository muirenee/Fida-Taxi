name: Fida Taxi CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "modernization/**"
      - "fix/**"
      - "chore/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fida-taxi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze, Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      FIDA_API_BASE_URL: https://taxi-api.netsource.co.rw/api/v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate deployment scripts
        run: bash -n deploy/backend.sh

      - name: Validate Docker Compose isolation
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          JWT_HS256_SECRET: ci-jwt-secret-ci-jwt-secret
          OTP_HMAC_SECRET: ci-otp-secret-ci-otp-secret
        run: docker compose --project-name fida-taxi -f deploy/docker-compose.yml config --quiet

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install backend dependencies
        working-directory: services/backend
        run: npm install

      - name: Typecheck NestJS backend
        working-directory: services/backend
        run: npm run typecheck

      - name: Build NestJS backend
        working-directory: services/backend
        run: npm run build

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache-dependency-path: services/telemetry/go.mod

      - name: Build Go telemetry
        working-directory: services/telemetry
        run: go build ./...

      - name: Test Go telemetry
        working-directory: services/telemetry
        run: go test ./...

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Display toolchain versions
        run: |
          node --version
          npm --version
          go version
          flutter --version
          dart --version
          java -version

      - name: Bootstrap workspace
        run: ./setup_workspace.sh --bootstrap-only

      - name: Verify reproducible Flutter bootstrap
        run: git diff --exit-code -- apps packages pubspec.lock

      - name: List workspace packages
        run: dart pub workspace list

      - name: Check formatting
        run: |
          dart format apps packages
          git diff -- packages/fida_app_auth/lib/src/phone_auth_gate.dart
          git diff --exit-code -- apps packages

      - name: Static analysis
        run: dart run melos run analyze --no-select

      - name: Pure Dart tests
        run: dart run melos run test:dart --no-select

      - name: Flutter tests
        run: dart run melos run test:flutter --no-select

      - name: Build Rider Android debug APK
        working-directory: apps/rider
        run: >-
          flutter build apk --debug --no-pub
          --dart-define=FIDA_API_BASE_URL=${FIDA_API_BASE_URL}

      - name: Stage Rider APK
        run: |
          mkdir -p dist
          cp apps/rider/build/app/outputs/flutter-apk/app-debug.apk dist/fida-taxi-rider-debug.apk

      - name: Upload Rider APK
        uses: actions/upload-artifact@v4
        with:
          name: fida-taxi-rider-debug
          path: dist/fida-taxi-rider-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Driver Android debug APK
        working-directory: apps/driver
        run: >-
          flutter build apk --debug --no-pub
          --dart-define=FIDA_API_BASE_URL=${FIDA_API_BASE_URL}

      - name: Stage Driver APK
        run: |
          mkdir -p dist
          cp apps/driver/build/app/outputs/flutter-apk/app-debug.apk dist/fida-taxi-driver-debug.apk

      - name: Upload Driver APK
        uses: actions/upload-artifact@v4
        with:
          name: fida-taxi-driver-debug
          path: dist/fida-taxi-driver-debug.apk
          if-no-files-found: error
          retention-days: 14
